<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>證件 A4 1:1 影印工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-subtle: #2c2c2e;
      --primary: #007aff;
      --success: #30d158;
      --text: #ffffff;
      --subtext: #8e8e93;
      --border: #38383a;
    }
    
    /* 禁用雙擊縮放及反彈滾動 */
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      margin: 0; 
      padding: 0;
      touch-action: manipulation;
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 8px) 16px;
      gap: 10px;
    }

    /* 頂部標題 */
    .app-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
      flex-shrink: 0;
    }
    .app-title:active { opacity: 0.6; }

    /* 上方控制面板 */
    .top-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 上傳卡片並排 */
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .upload-box {
      background: var(--card-bg);
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .upload-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .upload-box span {
      font-size: 13px;
      font-weight: 500;
      color: var(--subtext);
      pointer-events: none;
    }
    .rot-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #666;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      display: none;
      cursor: pointer;
    }

    /* 設定列 */
    .control-row {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      height: 34px;
      gap: 8px;
    }
    .control-label {
      font-size: 13px;
      color: var(--subtext);
      white-space: nowrap;
      min-width: 28px;
    }
    .btn-group {
      display: flex;
      flex: 1;
      gap: 3px;
    }
    .btn-group button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 5px 0;
      font-size: 12px;
      font-weight: 500;
      border-radius: 7px;
    }
    .btn-group button.active {
      background: var(--primary);
      color: #fff;
    }

    /* Quality 步進控制器 */
    .step-btn {
      background: var(--card-subtle);
      border: none;
      color: var(--text);
      width: 26px;
      height: 24px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:active { background: #3a3a3c; }
    .q-slider {
      flex: 1;
      accent-color: var(--primary);
      height: 4px;
    }
    .quality-display {
      font-size: 12px;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .est-badge {
      font-size: 11px;
      color: #ff9f0a;
      white-space: nowrap;
      margin-left: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* 中間 A4 預覽區：自動填滿剩餘高度，消除空隙 */
    .preview-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }
    .preview-container {
      height: 100%;
      max-height: 100%;
      aspect-ratio: 210 / 297;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .card-preview {
      width: 82%;
      aspect-ratio: 85.6 / 54;
      border: 1px dashed #b0b0b8;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f4f4f7;
    }
    .card-preview canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 底部操作區 */
    .bottom-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .result-info {
      display: none;
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
      border-radius: 9px;
      padding: 7px 10px;
      text-align: center;
    }
    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .action-btn:disabled { opacity: 0.35; }
    .action-btn.download-ready {
      background: var(--success);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- 頂部標題 -->
  <h1 class="app-title" onclick="safeBack()">證件 A4 1:1 影印工具</h1>

  <!-- 控制面板 -->
  <div class="top-section">
    <!-- 上傳卡片並排（完全隔離 input，杜絕旋轉誤開） -->
    <div class="upload-row">
      <div class="upload-box" id="box-front" onclick="openUpload('front', event)">
        <span>+ 正面相片</span>
        <img id="img-front" />
        <button type="button" class="rot-btn" id="rot-front" onclick="rotateCard('front', event)">↻ 90°</button>
        <input type="file" id="file-front" accept="image/*" style="display:none;" onchange="handleFile(this, 'front')">
      </div>
      <div class="upload-box" id="box-back" onclick="openUpload('back', event)">
        <span>+ 反面相片</span>
        <img id="img-back" />
        <button type="button" class="rot-btn" id="rot-back" onclick="rotateCard('back', event)">↻ 90°</button>
        <input type="file" id="file-back" accept="image/*" style="display:none;" onchange="handleFile(this, 'back')">
      </div>
    </div>

    <!-- 影印深淺 -->
    <div class="control-row">
      <span class="control-label">深淺</span>
      <div class="btn-group" id="tone-group">
        <button onclick="setTone(150, this)">較淡</button>
        <button class="active" onclick="setTone(190, this)">標準</button>
        <button onclick="setTone(220, this)">較深</button>
      </div>
    </div>

    <!-- 容量上限 -->
    <div class="control-row">
      <span class="control-label">容量</span>
      <div class="btn-group" id="mb-group">
        <button onclick="setTargetMB(0.5, this)">0.5M</button>
        <button onclick="setTargetMB(1.0, this)">1M</button>
        <button class="active" onclick="setTargetMB(2.0, this)">2M</button>
        <button onclick="setTargetMB(5.0, this)">5M</button>
      </div>
    </div>

    <!-- Quality 步進 -->
    <div class="control-row">
      <span class="control-label">品質</span>
      <button class="step-btn" onclick="stepQuality(-1)">−</button>
      <input type="range" class="q-slider" id="q-range" min="75" max="100" value="90" oninput="updateQuality(this.value)">
      <button class="step-btn" onclick="stepQuality(1)">+</button>
      <span class="quality-display" id="q-val">90%</span>
    </div>
  </div>

  <!-- 中間預覽區（自適應等比例放大） -->
  <div class="preview-wrapper">
    <div class="preview-container">
      <div class="card-preview"><canvas id="canvas-front"></canvas></div>
      <div class="card-preview"><canvas id="canvas-back"></canvas></div>
    </div>
  </div>

  <!-- 底部按鈕與狀態回報 -->
  <div class="bottom-section">
    <div class="result-info" id="result-info"></div>
    <button class="action-btn" id="main-btn" onclick="handleMainAction()" disabled>產生 A4 PDF</button>
  </div>

  <script>
    // 徹底禁用 iOS 雙擊縮放
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    function safeBack() {
      if (document.referrer && document.referrer.startsWith(window.location.origin)) {
        history.back();
      }
    }

    const data = {
      front: { img: null, rot: 0, canvas: document.getElementById('canvas-front') },
      back: { img: null, rot: 0, canvas: document.getElementById('canvas-back') },
      whiteThreshold: 190,
      targetMB: 2.0,
      quality: 90
    };

    let generatedResult = null;

    function resetGeneratedState() {
      generatedResult = null;
      document.getElementById('result-info').style.display = 'none';
      const btn = document.getElementById('main-btn');
      btn.classList.remove('download-ready');
      updateButtonText();
    }

    function stepQuality(delta) {
      let q = data.quality + delta;
      if (q < 75) q = 75;
      if (q > 100) q = 100;
      updateQuality(q);
    }

    function updateQuality(val) {
      data.quality = parseInt(val, 10);
      document.getElementById('q-range').value = data.quality;
      document.getElementById('q-val').innerText = `${data.quality}%`;
      resetGeneratedState();
      calculateEstimate();
    }

    function setTone(threshold, btn) {
      data.whiteThreshold = threshold;
      document.querySelectorAll('#tone-group button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      processAndRender('front');
      processAndRender('back');
      resetGeneratedState();
    }

    function setTargetMB(mb, btn) {
      data.targetMB = mb;
      document.querySelectorAll('#mb-group button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      resetGeneratedState();
      calculateEstimate();
    }

    function calculateEstimate() {
      if (!data.front.img && !data.back.img) {
        return;
      }

      let totalPx = 0;
      if (data.front.canvas.width) totalPx += data.front.canvas.width * data.front.canvas.height;
      if (data.back.canvas.width) totalPx += data.back.canvas.width * data.back.canvas.height;
      if (!data.front.img || !data.back.img) totalPx *= 2;

      const qRatio = data.quality / 100;
      const bpp = 0.05 + Math.pow(qRatio, 3.2) * 0.28;
      let estBytes = totalPx * bpp + 40000;

      const maxBytes = data.targetMB * 1024 * 1024;
      if (estBytes > maxBytes) estBytes = maxBytes;

      const estMB = (estBytes / (1024 * 1024)).toFixed(2);
      updateButtonText(estMB);
    }

    function updateButtonText(estMB) {
      const btn = document.getElementById('main-btn');
      if (generatedResult) {
        btn.innerText = "立即下載 / 分享 PDF";
        return;
      }
      if (data.front.img && data.back.img) {
        const est = estMB || document.getElementById('est-display').innerText.replace('預計: ~', '');
        btn.innerText = `產生 A4 PDF (預計 ~${est})`;
      } else {
        btn.innerText = "產生 A4 PDF";
      }
    }

    // 點擊上傳卡片（避開旋轉按鈕）
    function openUpload(side, e) {
      if (e.target.closest('.rot-btn')) return;
      document.getElementById(`file-${side}`).click();
    }

    function handleFile(input, side) {
      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const rawImg = new Image();
        rawImg.onload = () => {
          const maxDim = 2200;
          let w = rawImg.width, h = rawImg.height;
          if (w > maxDim || h > maxDim) {
            const ratio = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const offCanvas = document.createElement('canvas');
          offCanvas.width = w;
          offCanvas.height = h;
          const ctx = offCanvas.getContext('2d');
          ctx.drawImage(rawImg, 0, 0, w, h);

          const safeImg = new Image();
          safeImg.onload = () => {
            data[side].img = safeImg;
            data[side].rot = 0;
            document.getElementById(`img-${side}`).src = safeImg.src;
            document.getElementById(`img-${side}`).style.display = 'block';
            document.getElementById(`rot-${side}`).style.display = 'block';
            document.querySelector(`#box-${side} span`).style.display = 'none';
            processAndRender(side);
            checkReady();
            resetGeneratedState();
            calculateEstimate();
          };
          safeImg.src = offCanvas.toDataURL('image/jpeg', 0.95);
        };
        rawImg.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    // 獨立旋轉處理，不再誤開相簿
    function rotateCard(side, e) {
      if (e) {
        e.stopPropagation();
      }
      data[side].rot = (data[side].rot + 90) % 360;
      processAndRender(side);
      resetGeneratedState();
    }

    function processAndRender(side) {
      const card = data[side];
      if (!card.img) return;

      const canvas = card.canvas;
      const is90 = card.rot === 90 || card.rot === 270;
      const w = is90 ? card.img.height : card.img.width;
      const h = is90 ? card.img.width : card.img.height;

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate((card.rot * Math.PI) / 180);
      ctx.drawImage(card.img, -card.img.width / 2, -card.img.height / 2);
      ctx.restore();

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const threshold = data.whiteThreshold;

      for (let i = 0; i < d.length; i += 4) {
        let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        if (gray > threshold) {
          gray = 255;
        } else {
          gray = (gray / threshold) * 255;
          gray = gray < 50 ? gray * 0.6 : gray; 
        }
        d[i] = gray;
        d[i+1] = gray;
        d[i+2] = gray;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function checkReady() {
      if (data.front.img && data.back.img) {
        document.getElementById('main-btn').disabled = false;
        updateButtonText();
      }
    }

    async function getOptimizedJPEG(canvas, maxBytesPerCard, startQuality) {
      let q = startQuality / 100;
      let scale = 1.0;
      let blob = null;

      while (scale >= 0.4) {
        let workCanvas = canvas;
        if (scale < 1.0) {
          workCanvas = document.createElement('canvas');
          workCanvas.width = Math.round(canvas.width * scale);
          workCanvas.height = Math.round(canvas.height * scale);
          const ctx = workCanvas.getContext('2d');
          ctx.drawImage(canvas, 0, 0, workCanvas.width, workCanvas.height);
        }

        while (q >= 0.05) {
          blob = await new Promise(res => workCanvas.toBlob(res, 'image/jpeg', q));
          if (blob.size <= maxBytesPerCard) {
            return { blob, finalQ: Math.round(q * 100) };
          }
          q = parseFloat((q - 0.01).toFixed(2));
        }

        scale -= 0.2;
        q = 0.85;
      }
      return { blob, finalQ: Math.round(q * 100) };
    }

    async function handleMainAction() {
      if (generatedResult) {
        downloadOrSharePDF();
        return;
      }

      const btn = document.getElementById('main-btn');
      btn.disabled = true;
      btn.innerText = "正在處理並壓縮...";

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        const targetBytes = data.targetMB * 1024 * 1024 - 40 * 1024;
        const maxBytesPerCard = Math.floor(targetBytes / 2);

        const frontRes = await getOptimizedJPEG(data.front.canvas, maxBytesPerCard, data.quality);
        const backRes = await getOptimizedJPEG(data.back.canvas, maxBytesPerCard, data.quality);
        const actualQuality = Math.min(frontRes.finalQ, backRes.finalQ);

        const frontDataUrl = await blobToDataURL(frontRes.blob);
        const backDataUrl = await blobToDataURL(backRes.blob);

        const cardW = 85.6;
        const cardH = 54.0;
        const xPos = (210 - cardW) / 2;
        const yPosFront = 65;
        const yPosBack = yPosFront + cardH + 20;

        doc.addImage(frontDataUrl, 'JPEG', xPos, yPosFront, cardW, cardH);
        doc.addImage(backDataUrl, 'JPEG', xPos, yPosBack, cardW, cardH);

        const pdfBlob = doc.output('blob');
        const finalSizeMB = (pdfBlob.size / (1024 * 1024)).toFixed(2);
        const fileName = `ID_Card_A4_1to1_${finalSizeMB}MB_Q${actualQuality}%.pdf`;

        generatedResult = {
          blob: pdfBlob,
          sizeMB: finalSizeMB,
          quality: actualQuality,
          fileName: fileName
        };

        const infoEl = document.getElementById('result-info');
        infoEl.innerHTML = `✓ 已生成：<b>${finalSizeMB} MB</b>｜實際品質：<b>${actualQuality}%</b>`;
        infoEl.style.display = 'block';

        btn.classList.add('download-ready');
        btn.innerText = "立即下載 / 分享 PDF";
        btn.disabled = false;

      } catch (err) {
        alert("生成失敗: " + err.message);
        btn.disabled = false;
        updateButtonText();
      }
    }

    async function downloadOrSharePDF() {
      if (!generatedResult) return;
      const file = new File([generatedResult.blob], generatedResult.fileName, { type: 'application/pdf' });
      
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        const downloadUrl = URL.createObjectURL(generatedResult.blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `ID_Card.pdf`;
        a.click();
        URL.revokeObjectURL(downloadUrl);
      }
    }

    function blobToDataURL(blob) {
      return new Promise((res) => {
        const reader = new FileReader();
        reader.onloadend = () => res(reader.result);
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
